[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddm-mcts"
version = "0.1.0"
description = "Direct Decision Model guided Monte Carlo Tree Search experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
robotics = ["mujoco>=3.3,<4", "numpy>=1.26"]
vlm = ["torch>=2.6,<3", "torchvision>=0.21", "transformers>=4.57,<5", "accelerate>=1", "Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]
laya = ["laya>=0.3"]
# Mica is served by its official SystemOne HTTP server; the client uses Python's stdlib.
mica = []

[project.scripts]
ddm-robotics = "ddm_mcts.robotics.cli:main"
ddm-mcts = "ddm_mcts.cli:main"

[tool.setuptools.packages.find]
include = ["ddm_mcts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
